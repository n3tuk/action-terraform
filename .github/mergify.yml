---
# Renovate pull requests are deliberately created as drafts. Once a maintainer promotes a pull request for review,
# these rules ensure that only Renovate or the terraform-docs GitHub App have changed the branch before Mergify approves
# and merges it.

pull_request_rules:
  # Automatically approve a promoted Renovate pull request only after its BATS check succeeds and it is current with
  # the main branch.
  - name: Automatic approval for Renovate pull requests
    conditions:
      - author=renovate[bot]
      - base=main
      - "#commits-behind=0"
      - -conflict
      - -closed
      - -draft
      - check-success=BATS
      - or:
          - commits[*].author==renovate[bot]
          - commits[*].author==n3tuk-terraform-docs[bot]
    actions:
      review:
        type: APPROVE

  # Automatically rebase-merge an approved, promoted Renovate pull request after BATS succeeds and the required
  # branch-state checks have passed.
  - name: Automatic merge for Renovate pull requests
    conditions:
      - author=renovate[bot]
      - base=main
      - linear-history
      - "#approved-reviews-by>=1"
      - -label=force-ci-run
      - -conflict
      - -closed
      - -draft
      - check-success=BATS
      - or:
          - commits[*].author==renovate[bot]
          - commits[*].author==n3tuk-terraform-docs[bot]
    actions:
      merge:
        method: merge
