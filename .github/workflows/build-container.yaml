      #     # cosign sign --yes ...
      #     images=()
      #     for tag in ${TAGS}; do
      #       echo "Signing image: ${tag}@${DIGEST}"
      #       images+=("${tag}@${DIGEST}")
      #     done
      #     cosign --verbose sign --yes "${images[@]}"
