---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

tasks:
  zizmor:
    desc: Analyse GitHub Workflows, Actions, and Dependabot with zizmor
    summary: |-
      Run zizmor against the GitHub Workflows, GitHub Actions configuration, and GitHub Dependabot configurations to
      identify any potential issues with artifact integrity, excessive permissions, injection weaknesses, secrets
      exposure weaknesses, trigger misuse, and unpinned dependencies.
    silent: true
    cmds:
      - defer: "{{ if .EXIT_CODE }}echo -e '\e[1;31mFailed\e[0m'{{ end }}"
      - task: zizmor:workflows
      - task: zizmor:actions
      - task: zizmor:dependabot
      - cmd: echo -e '\e[0;32mPassed\e[0m'

  zizmor:workflows:
    desc: Analyse the GitHub Workflows with zizmor
    summary: |-
      Run zizmor against the GitHub Workflows to identify any potential issues with artifact integrity, excessive
      permissions, injection weaknesses, secrets exposure weaknesses, trigger misuse, and unpinned dependencies.
    sources:
      - .github/workflows/*.yaml
      - .github/zizmor.yaml
    silent: true
    cmds:
      - defer: "{{ if .EXIT_CODE }}echo -e '\e[1;31mFailed\e[0m'{{ end }}"
      - if: ls .github/workflows/*.yaml >/dev/null 2>&1
        cmd: zizmor --persona auditor --no-progress --format plain .github/workflows/*.yaml
      - cmd: echo -e '\e[0;32mPassed\e[0m'

  zizmor:dependabot:
    aliases:
      - dependabot
    desc: Analyse the GitHub Dependabot configuration with zizmor
    summary: |-
      Run the static analysis tool `zizmor` against the GitHub Dependabot configuration to identify any potential
      misconfiguration issues or security weaknesses within the workflows.
    sources:
      - .github/dependabot.yaml
      - .github/zizmor.yaml
    silent: true
    cmds:
      - defer: "{{ if .EXIT_CODE }}echo -e '\e[1;31mFailed\e[0m'{{ end }}"
      - if: "[ -f .github/dependabot.yaml ]"
        cmd: zizmor --persona auditor --no-progress --format plain .github/dependabot.yaml
      - cmd: echo -e '\e[0;32mPassed\e[0m'

  zizmor:actions:
    aliases:
      - actions
    desc: Analyse the GitHub Actions configuration with zizmor
    summary: |-
      Run the static analysis tool `zizmor` against the GitHub Action configuration to identify any potential
      misconfiguration issues or security weaknesses within the workflows.
    sources:
      - action.yaml
      - .github/zizmor.yaml
    silent: true
    cmds:
      - defer: "{{ if .EXIT_CODE }}echo -e '\e[1;31mFailed\e[0m'{{ end }}"
      - if: "[ -f action.yaml ]"
        cmd: zizmor --persona auditor --no-progress --format plain action.yaml
      - cmd: echo -e '\e[0;32mPassed\e[0m'
